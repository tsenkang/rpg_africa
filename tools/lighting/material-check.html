<!doctype html>
<!-- Lookdev dos materiais (L2): esferas com os materiais do jogo, o MaterialFactory e o IBL do céu.
     Com o servidor de dev: http://localhost:5173/tools/lighting/material-check.html?wet=0|1 -->
<html><head><meta charset="utf-8"><style>body{margin:0;background:#111;font:12px system-ui;color:#ddd}#l{position:fixed;bottom:0;left:0;right:0;display:flex}#l div{flex:1;text-align:center;padding:4px 0}</style></head>
<body><div id="l"></div><script type="module">
import * as THREE from 'three';
import { createMaterials } from '/src/render/Materials.js';
import { MaterialFactory } from '/src/render/lighting/MaterialFactory.js';
import { EnvironmentLighting } from '/src/render/lighting/EnvironmentLighting.js';
const W = 1400, H = 420, wet = +(new URLSearchParams(location.search).get('wet') ?? 0);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(W, H); r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace; r.shadowMap.enabled = true;
document.body.prepend(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8fb3d9);
const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 100); cam.position.set(0, 2.4, 9.5); cam.lookAt(0, 0.6, 0);
// céu igual ao do jogo (mesmo shader simplificado de gradiente + sol) para o IBL
const sky = new THREE.ShaderMaterial({ uniforms: { uTop: { value: new THREE.Color(0x3f78c2) }, uHorizon: { value: new THREE.Color(0xe6d3ad) }, uSunDir: { value: new THREE.Vector3(0.5, 0.55, 0.65).normalize() }, uSunColor: { value: new THREE.Color(1, 0.92, 0.8) }, uSunStrength: { value: 1 } }, side: THREE.BackSide,
  vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'uniform vec3 uTop,uHorizon,uSunDir,uSunColor; uniform float uSunStrength; varying vec3 vDir; void main(){ vec3 d=normalize(vDir); float h=max(d.y,0.0); vec3 c=mix(uHorizon,uTop,pow(smoothstep(0.0,0.55,h),0.8)); float s=max(dot(d,normalize(uSunDir)),0.0); c+=uSunColor*(pow(s,900.0)*18.0+pow(s,12.0)*0.18)*uSunStrength; gl_FragColor=vec4(c,1.0);\n#include <tonemapping_fragment>\n#include <colorspace_fragment>\n}' });
const ibl = new EnvironmentLighting(r, scene, sky);
ibl.update(1, { night: 0, state: { hemiGround: new THREE.Color(0x6a5a44) } });
const sun = new THREE.DirectionalLight(0xfff0dc, 2.6); sun.position.set(5, 6, 7); sun.castShadow = true; scene.add(sun);
scene.add(new THREE.HemisphereLight(0x9ab8dd, 0x5a4a38, 0.35));
const M = createMaterials();
const mf = new MaterialFactory(); mf.applyLibrary(M);
mf.uniforms.uWet.value = wet;
// "areia" do terreno: material padrão com vertexColors arenosas + micro-brilho
const sand = new THREE.MeshStandardMaterial({ color: 0xd9b27a, roughness: 0.95 }); mf.install(sand, { wet: true, glint: true });
const list = [['iron', 'Ferro'], ['gold', 'Ouro'], ['glass', 'Vidro'], ['basaltDark', 'Pedra de Kaelen'], ['snowCap', 'Gelo/neve'], [sand, 'Areia (brilho)'], ['cobble', 'Calçamento'], ['tilesRed', 'Telha']];
const geo = new THREE.SphereGeometry(0.62, 96, 64);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 8).rotateX(-Math.PI / 2), M.cobble); floor.receiveShadow = true; scene.add(floor);
list.forEach(([k, label], i) => {
  const m = new THREE.Mesh(geo, typeof k === 'string' ? M[k] : k); m.position.set((i - (list.length - 1) / 2) * 1.55, 0.62, 0); m.castShadow = true; scene.add(m);
  const d = document.createElement('div'); d.textContent = label; document.getElementById('l').appendChild(d);
});
r.render(scene, cam);
window.done = true;
</script></body></html>
